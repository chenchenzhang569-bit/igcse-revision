<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" style="background:#fff;font-family:Arial,sans-serif">
  <text x="250" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Bread Dough — Before and After Compression</text>
  
  <!-- Before: large circle -->
  <circle cx="140" cy="170" r="80" fill="#F5A623" stroke="#C17D11" stroke-width="2"/>
  <text x="140" y="155" text-anchor="middle" font-size="11" fill="white" font-weight="bold">BEFORE</text>
  <text x="140" y="220" text-anchor="middle" font-size="9" fill="#333">Mass = m</text>
  <text x="140" y="195" text-anchor="middle" font-size="9" fill="#333">Volume = V</text>
  
  <!-- Compression arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#E85D3A"/>
    </marker>
  </defs>
  <line x1="230" y1="155" x2="270" y2="155" stroke="#E85D3A" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="230" y1="185" x2="270" y2="185" stroke="#E85D3A" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="250" y="145" text-anchor="middle" font-size="10" fill="#E85D3A" font-weight="bold">COMPRESS</text>
  
  <!-- After: small circle -->
  <circle cx="370" cy="170" r="50" fill="#C17D11" stroke="#F5A623" stroke-width="2"/>
  <text x="370" y="155" text-anchor="middle" font-size="11" fill="white" font-weight="bold">AFTER</text>
  <text x="370" y="235" text-anchor="middle" font-size="9" fill="#333">Mass = m (unchanged)</text>
  <text x="370" y="200" text-anchor="middle" font-size="9" fill="#333">Volume &lt; V</text>
  
  <!-- Conclusion -->
  <rect x="100" y="265" width="300" height="45" rx="8" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="250" y="283" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">No material lost → Mass stays the same</text>
  <text x="250" y="300" text-anchor="middle" font-size="11" fill="#2E7D32">Weight = m × g → Weight also stays the same</text>
</svg>